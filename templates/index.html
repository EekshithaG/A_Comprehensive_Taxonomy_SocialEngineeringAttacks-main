<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login & Registration</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- AOS CSS for animations -->
  <link href="https://unpkg.com/aos@next/dist/aos.css" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Overall page styling with a custom gradient background */
    body {
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 30px 0;
    }
    /* Container for the login & register forms */
    .login-register-section {
      margin-top: 30px;
    }
    /* Styling for the individual form containers */
    .login-container, .register-container {
      background-color: #ffffff;
      border-radius: 15px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
      padding: 30px;
      margin-bottom: 30px;
    }
    /* Headings for each form */
    h2 {
      margin-bottom: 20px;
      color: #333;
      font-weight: 600;
    }
    /* Form controls styling */
    .form-control {
      border-radius: 50px;
      border: 1px solid #ccc;
      padding: 12px 20px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .form-control:focus {
      border-color: #ef6603;
      box-shadow: 0 0 8px rgba(239,102,3,0.1);
    }
    /* Custom button styling */
    .btn-custom {
      background-color: #ef6603;
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 18px;
      border-radius: 50px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease-in-out;
    }
    .btn-custom:hover {
      background-color: #d95502;
    }
    /* Alert styling for messages */
    .alert {
      border-radius: 50px;
      padding: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container login-register-section">
    {% if messages %}
      <div class="row">
        <div class="col-md-12">
          {% for message in messages %}
            <div class="alert alert-success" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      </div>
    {% endif %}

    <div class="row justify-content-center">
      <!-- Login Form Container -->
      <div class="col-lg-5 login-container" data-aos="fade-right" data-aos-delay="200">
        <h2>Login</h2>
        <form action="{% url 'user_login' %}" method="post">
          {% csrf_token %}
          <div class="row gy-4">
            <div class="col-md-12">
              <input type="text" name="username" class="form-control" placeholder="Your Username" required>
            </div>
            <div class="col-md-12">
              <input type="password" name="password" class="form-control" placeholder="Your Password" required>
            </div>
            <div class="col-md-12 text-center">
              <button type="submit" class="btn-custom">
                <i class="fas fa-sign-in-alt"></i> Login
              </button>
            </div>
          </div>
        </form>
      </div>
      <!-- Registration Form Container -->
      <div class="col-lg-5 register-container" data-aos="fade-left" data-aos-delay="200">
        <h2>Register</h2>
        <form action="{% url 'user_registration' %}" method="post">
          {% csrf_token %}
          <div class="row gy-4">
            <div class="col-md-6">
              <input type="text" name="first_name" class="form-control" placeholder="First Name" required>
            </div>
            <div class="col-md-6">
              <input type="text" name="last_name" class="form-control" placeholder="Last Name" required>
            </div>
            <div class="col-md-6">
              <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="col-md-6">
              <input type="email" name="email" class="form-control" placeholder="Your Email" required>
            </div>
            <div class="col-md-6">
              <input type="password" name="password" class="form-control" placeholder="Password" required>
            </div>
            <div class="col-md-6">
              <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
            </div>
            <div class="col-md-12 text-center">
              <button type="submit" class="btn-custom">
                <i class="fas fa-user-plus"></i> Register
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
  
  <!-- Bootstrap JS Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AOS JS for animations -->
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
</body>
</html>
